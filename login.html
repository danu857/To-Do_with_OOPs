<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8" />

    <meta
        content="width=device-width, initial-scale=1.0"
        name="viewport"
    />

    <title>Login - Crushit</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    />

    <!-- SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: 0.4s;
            position: relative;
        }

        /* DARK MODE */

        body.dark-mode {
            background: linear-gradient(
                135deg,
                #000000,
                rgb(20, 20, 109)
            );
            color: white;
        }

        /* LIGHT MODE */

        body.light-mode {
            background: linear-gradient(
                135deg,
                #eef2ff,
                #dbe4ff
            );
            color: #111827;
        }

        /* GLOW EFFECTS */

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            z-index: -1;
            animation: pulse 6s infinite;
        }

        .circle1 {
            width: 300px;
            height: 300px;
            background: #4361ee;
            top: -100px;
            left: -100px;
        }

        .circle2 {
            width: 250px;
            height: 250px;
            background: #7209b7;
            bottom: -100px;
            right: -100px;
        }

        /* LOGIN BOX */

        .login-box {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            animation: slideUp 1s ease;
            transition: 0.4s;
        }

        body.dark-mode .login-box {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        body.light-mode .login-box {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.1);
        }

        .login-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
        }

        /* INPUT */

        .form-control {
            height: 55px;
            border-radius: 14px;
            padding-left: 15px;
            transition: 0.3s;
        }

        body.dark-mode .form-control {
            background: #1f2937;
            border: 1px solid #374151;
            color: white;
        }

        body.dark-mode .form-control:focus {
            background: #1f2937;
            color: white;
            border-color: #6e82f1;
            box-shadow: none;
        }

        body.light-mode .form-control {
            background: white;
            border: 1px solid #d1d5db;
            color: #111827;
        }

        body.light-mode .form-control:focus {
            background: white;
            color: #111827;
            border-color: #6e82f1;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #9ca3af;
        }

        /* BUTTONS */

        .btn-login {
            height: 55px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            background: rgb(20, 20, 109);
            color: white;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(67, 97, 238, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            background: #5f73f3;
            box-shadow: 0 0 30px rgba(67, 97, 238, 0.5);
        }

        .btn-cancel {
            height: 55px;
            border-radius: 14px;
            font-weight: 600;
        }

        /* THEME BUTTON */

        .theme-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            font-size: 1.2rem;
            transition: 0.4s;
        }

        body.dark-mode .theme-btn {
            background: #ffffff15;
            color: white;
        }

        body.light-mode .theme-btn {
            background: white;
            color: #111827;
        }

        /* PASSWORD ICON */

        .password-box {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
            color: #9ca3af;
        }

        /* ERROR */

        .error {
            color: #ff6b6b;
            margin-top: 6px;
            font-size: 14px;
        }

        /* ANIMATIONS */

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        @keyframes pulse {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }

    </style>

</head>

<body class="dark-mode">

    <!-- GLOW -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <!-- THEME TOGGLE -->
    <button
        class="theme-btn"
        id="themeToggle"
    >
        <i
            class="bi bi-moon-stars-fill"
            id="themeIcon"
        ></i>
    </button>

    <!-- LOGIN BOX -->
    <div class="login-box">

        <h2 class="login-title">
            Welcome Back
        </h2>

        <form id="loginForm">

            <!-- USERNAME -->
            <div class="mb-4">
                <input
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter Username"
                    type="text"
                />
            </div>

            <!-- PASSWORD -->
            <div class="mb-4 password-box">

                <input
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    type="password"
                />

                <i
                    class="bi bi-eye-slash toggle-password"
                    id="togglePassword"
                ></i>

            </div>

            <!-- BUTTONS -->
            <div class="d-flex gap-3">

                <button
                    class="btn btn-login w-100"
                    type="submit"
                >
                    Login
                </button>

                <button
                    class="btn btn-outline-light btn-cancel w-100"
                    id="cancelBtn"
                    type="button"
                >
                    Cancel
                </button>

            </div>

            <!-- REGISTER -->
            <div class="text-center mt-4">

                <p class="mb-2">
                    Don't have an account?
                </p>

                <a
                    class="btn btn-outline-light px-4"
                    href="register.html"
                    id="registerBtn"
                >
                    Register
                </a>

            </div>

        </form>

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery Validation -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/additional-methods.min.js"></script>

    <!-- bcrypt -->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@3.0.3/umd/index.js"></script>

    <!-- Custom JS -->
    <script src="common.js"></script>
    <script src="user.js"></script>
    <script src="login.js"></script>

</body>

</html>
