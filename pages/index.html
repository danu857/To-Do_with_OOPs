<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Crushit - ToDo App</title>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&;display=swap" rel="stylesheet"/>
<style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            overflow-x:hidden;
            transition:0.4s;
        }

        /* DARK MODE */

        body.dark-mode{
            background:linear-gradient(
                135deg,
                #000000,
                rgb(20,20,109)
            );

            color:white;
        }

        /* LIGHT MODE */

        body.light-mode{
            background:linear-gradient(
                135deg,
                #f5f7ff,
                #dbe4ff
            );

            color:#111827;
        }

        /* NAVBAR */

        .navbar{
            backdrop-filter:blur(10px);
            transition:0.4s;
        }

        body.dark-mode .navbar{
            background:rgba(17,24,39,0.7);
        }

        body.light-mode .navbar{
            background:rgba(255,255,255,0.7);
        }

        .navbar-brand{
            font-size:2rem;
            font-weight:700;
        }

        /* HERO */

        .hero{
            min-height:100vh;
            display:flex;
            align-items:center;
            position:relative;
            overflow:hidden;
        }

        .hero-title{
            font-size:4rem;
            font-weight:700;
            line-height:1.2;
            animation:slideUp 1s ease;
        }

        .hero-text{
            margin:25px 0;
            font-size:1.1rem;
            animation:fadeIn 1.5s ease;
        }

        body.dark-mode .hero-text{
            color:#cbd5e1;
        }

        body.light-mode .hero-text{
            color:#374151;
        }

        /* BUTTONS */

        .btn-custom{
            padding:12px 28px;
            border-radius:12px;
            font-weight:600;
            transition:0.3s;
            color:#000000
        }

        .btn-primary-custom{
            background:rgb(20,20,109);
            border:none;
            color:white;
        }


        .btn-outline-custom:hover{
            transform:translateY(-3px);
        }

        /* TASK CARD */

        .task-card{
            border-radius:30px;
            /* padding:35px; */
            position:relative;
            overflow:hidden;
            animation:float 4s ease-in-out infinite;
            transition:0.4s;
        }

        body.dark-mode .task-card{
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:0 0 40px rgba(0,0,0,0.5);
        }

        body.light-mode .task-card{
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.4);
            box-shadow:0 0 40px rgba(0,0,0,0.1);
        }

        /* TASK ITEM */

        .task-item{
            padding:15px 18px;
            border-radius:15px;
            margin-bottom:18px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            transition:0.3s;
            cursor:pointer;
        }

        body.dark-mode .task-item{
            background:#252b38;
        }

        body.light-mode .task-item{
            background:#eef2ff;
        }

        .task-item:hover{
            transform:translateX(10px) scale(1.02);
        }

        /* THEME BUTTON */

        .theme-btn{
            width:50px;
            height:50px;
            border-radius:50%;
            border:none;
            cursor:pointer;
            transition:0.4s;
            font-size:1.2rem;
        }

        body.dark-mode .theme-btn{
            background:#ffffff15;
            color:white;
        }

        body.light-mode .theme-btn{
            background:#ffffff;
            color:#111827;
        }

        /* GLOW CIRCLES */

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(80px);
            opacity:0.5;
            z-index:-1;
        }

        .circle1{
            width:300px;
            height:300px;
            background:#4361ee;
            top:-100px;
            right:-100px;
        }

        .circle2{
            width:250px;
            height:250px;
            background:#7209b7;
            bottom:-100px;
            left:-100px;
        }

        .hero-image{
            width:550px;
            height: 350px;
            border-radius:10px;
            transition:0.4s;
        }

        body.dark-mode .hero-image{
            box-shadow:0 10px 35px rgba(0,0,0,0.4);
        }

        body.light-mode .hero-image{
            box-shadow:0 10px 35px rgba(0,0,0,0.15);
        }

        .hero-image:hover{
            transform:scale(1.02);
        }

        /* RESPONSIVE */

        @media(max-width:768px){

            .hero-title{
                font-size:2.8rem;
            }

            .hero{
                text-align:center;
                padding-top:50px;
            }

        }

    </style>
</head>
<body class="dark-mode">
    <!-- GLOW EFFECTS !-->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <nav class="navbar navbar-expand-lg py-3">
        <div class="container">
            <a class="navbar-brand text-white" href="#" id="logoText">Crushit</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <button class="theme-btn" id="themeToggle">
                    <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
                </button>
            
                <a class="btn btn-outline-light btn-custom" href="login.html" id="loginBtn">Login</a>
                <a class="btn btn-primary-custom btn-custom" href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <div class="row align-items-center g-5">
                <div class="col-lg-6">
                    <h1 class="hero-title">
                            Organize Your <br/>
                            Daily Tasks Easily
                    </h1>
                    <p class="hero-text">
                            Crush your goals, manage your daily workflow,
                            track productivity, and stay focused with the
                            smartest ToDo application.
                    </p>
                    <div class="d-flex gap-3 flex-wrap">
                        <a class="btn btn-primary-custom btn-custom" href="register.html">Get Started</a>
                        <a class="btn btn-outline-custom btn-custom" href="#">Learn More</a>
                    </div>
                </div>

                <div class="col-lg-6 text-center">
                    <img alt="Task Management Dashboard" class="hero-image" src="/todoimg.png"/>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
