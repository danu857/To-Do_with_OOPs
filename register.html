<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Crushit</title>
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow-x:hidden;
            padding:40px 15px;
            transition:0.4s;
            position:relative;
        }

        /* DARK MODE */

        body.dark-mode{
            background:linear-gradient(
                135deg,
                #000000,
                rgb(20,20,109)
            );
            color:white;
        }

        /* LIGHT MODE */

        body.light-mode{
            background:linear-gradient(
                135deg,
                #eef2ff,
                #dbe4ff
            );
            color:#111827;
        }

        /* GLOW EFFECT */

        .circle{
            position:absolute;
            border-radius:50%;
            filter:blur(90px);
            opacity:0.5;
            z-index:-1;
            animation:pulse 8s infinite;
        }

        .circle1{
            width:300px;
            height:300px;
            background:#4361ee;
            top:-100px;
            left:-100px;
        }

        .circle2{
            width:280px;
            height:280px;
            background:#7209b7;
            bottom:-100px;
            right:-100px;
        }

        /* REGISTER BOX */

        .register-box{
            width:100%;
            max-width:750px;
            border-radius:30px;
            padding:40px;
            backdrop-filter:blur(15px);
            animation:slideUp 1s ease;
            transition:0.4s;
        }

        body.dark-mode .register-box{
            background:rgba(17,24,39,0.92);
            border:1px solid rgba(255,255,255,0.08);
            box-shadow:0 0 40px rgba(0,0,0,0.5);
        }

        body.light-mode .register-box{
            background:rgba(255,255,255,0.75);
            border:1px solid rgba(255,255,255,0.4);
            box-shadow:0 0 40px rgba(0,0,0,0.1);
        }

        .register-title{
            text-align:center;
            font-size:2.2rem;
            font-weight:700;
            margin-bottom:35px;
        }

        label{
            font-weight:500;
            margin-bottom:8px;
        }

        /* INPUTS */

        .form-control,
        .form-select{
            height:52px;
            border-radius:14px;
            transition:0.3s;
        }

        body.dark-mode .form-control,
        body.dark-mode .form-select{
            background:#1f2937;
            border:1px solid #374151;
            color:white;
        }

        body.dark-mode .form-control:focus,
        body.dark-mode .form-select:focus{
            background:#1f2937;
            color:white;
            border-color:#6e82f1;
            box-shadow:none;
        }

        body.light-mode .form-control,
        body.light-mode .form-select{
            background:white;
            border:1px solid #d1d5db;
            color:#111827;
        }

        body.light-mode .form-control:focus,
        body.light-mode .form-select:focus{
            background:white;
            color:#111827;
            border-color:#6e82f1;
            box-shadow:none;
        }

        .form-control::placeholder{
            color:#9ca3af;
        }

        /* BUTTON */

        .btn-register{
            height:55px;
            border:none;
            border-radius:14px;
            background:rgb(20,20,109);
            color:white;
            font-weight:600;
            transition:0.3s;
            /* box-shadow:0 0 20px rgba(67,97,238,0.3); */
        }

        .btn-register:hover{
            transform:translateY(-3px);
            background:#5d71f3;
            /* box-shadow:0 0 30px rgba(67,97,238,0.5); */
            color:white;
        }

        /* LOGIN LINK */

        .text-link{
            color:#6e82f1;
            text-decoration:none;
            font-weight:600;
        }

        .text-link:hover{
            color:#8ea0ff;
        }

        /* ERROR */

        .error{
            color:#ff6b6b;
            font-size:14px;
            margin-top:5px;
        }

        /* CHECKBOX */

        .form-check-input:checked{
            background-color:#4361ee;
            border-color:#4361ee;
        }

        /* PASSWORD */

        .password-box{
            position:relative;
        }

        .toggle-password{
            position:absolute;
            top:50%;
            right:15px;
            transform:translateY(-50%);
            cursor:pointer;
            color:#9ca3af;
            font-size:1.1rem;
        }

        /* THEME BUTTON */

        .theme-btn{
            position:absolute;
            top:20px;
            right:20px;
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            transition:0.4s;
            font-size:1.2rem;
        }

        body.dark-mode .theme-btn{
            background:#ffffff15;
            color:white;
        }

        body.light-mode .theme-btn{
            background:white;
            color:#111827;
        }


        /* ANIMATION */

        @keyframes slideUp{

            from{
                opacity:0;
                transform:translateY(50px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @keyframes pulse{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.2);
            }

            100%{
                transform:scale(1);
            }

        }

    </style>
</head>
<body class="dark-mode">

    <!-- GLOW -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <!-- THEME BUTTON -->
    <button class="theme-btn" id="themeToggle">
        <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
    </button>

    <!-- REGISTER BOX -->
    <div class="register-box">
        <h2 class="register-title">Create Account</h2>
        <form id="registerForm">
            <div class="row">
                <!-- FIRST NAME -->
                <div class="col-md-6 mb-3">
                    <label>First Name</label>
                    <input
                        class="form-control"
                        id="firstname"
                        name="firstname"
                        placeholder="Enter First Name"
                        type="text"
                    />
                </div>

                <!-- LAST NAME -->
                <div class="col-md-6 mb-3">
                    <label>Last Name</label>
                    <input
                        class="form-control"
                        id="lastname"
                        name="lastname"
                        placeholder="Enter Last Name"
                        type="text"
                    />
                </div>

            </div>

            <!-- USERNAME -->
            <div class="mb-3">
                <label>Username</label>
                <input
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter Username"
                    type="text"
                />
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label>Email Address</label>
                <input
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter Email"
                    type="email"
                />
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label>Password</label>

                <div class="password-box">
                    <input
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        type="password"
                    />

                    <i
                        class="bi bi-eye-slash toggle-password"
                        id="togglePassword"
                    ></i>
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="mb-3">
                <label>Confirm Password</label>

                <div class="password-box">
                    <input class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" type="password"/>
                    <i class="bi bi-eye-slash toggle-password" id="toggleConfirmPassword"></i>
                </div>
            </div>

            <!-- CONTACT -->
            <div class="mb-3">
                <label>Contact Number</label>
                <input class="form-control" id="contact" name="contact" placeholder="Enter Contact Number" type="text"/>
            </div>

            <div class="row">
                <!-- DOB -->
                <div class="col-md-6 mb-3">
                    <label>Date of Birth</label>
                    <input class="form-control" id="dob" name="dob" type="date"/>
                </div>

                <!-- AGE -->
                <div class="col-md-6 mb-3">
                    <label>Age</label>
                    <input class="form-control" id="age" name="age" readonly type="number"/>
                </div>
            </div>

            <!-- NATIONALITY -->
            <div class="mb-3">
                <label>Nationality</label>

                <select class="form-select" id="nationality">
                    <option value="">Select Nationality</option>
                    <option>Indian</option>
                    <option>American</option>
                    <option>Canadian</option>
                    <option>Australian</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- GENDER -->
            <div class="mb-4">
                <label class="d-block mb-2">Gender</label>
                <div class="d-flex gap-4 flex-wrap">
                    <div class="form-check">
                        <input class="form-check-input" name="gender" type="radio" value="Male"/>
                        <label class="form-check-label">Male</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" name="gender" type="radio" value="Female"/>
                        <label class="form-check-label">Female</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" name="gender" type="radio" value="Others"/>
                        <label class="form-check-label">Others</label>
                    </div>
                </div>
            </div>

            <!-- SKILLS -->
            <div class="mb-4">
                <label class="d-block mb-3">Skills</label>
                <div class="row g-3">
                    <div class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" name="skills" type="checkbox" value="HTML"/>
                            <label class="form-check-label">HTML</label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" name="skills" type="checkbox" value="CSS"/>
                            <label class="form-check-label">CSS</label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" name="skills" type="checkbox" value="JavaScript"/>
                            <label class="form-check-label">JavaScript</label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" name="skills" type="checkbox" value="Bootstrap"/>
                            <label class="form-check-label">Bootstrap</label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" name="skills" type="checkbox" value="React">
                            <label class="form-check-label">React</label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" name="skills" type="checkbox" value="Python">
                            <label class="form-check-label">Python</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BUTTON -->
            <button class="btn btn-register w-100"type="submit">Create Profile</button>
        </form>

        <!-- LOGIN -->
        <div class="text-center mt-4">
            Already have an account?
            <a class="text-link" href="login.html">Login</a>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/additional-methods.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@3.0.3/umd/index.js"></script>
    <script src="common.js"></script>
    <script src="user.js"></script>
    <script src="register.js"></script>

</body>
</html>
